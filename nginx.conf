# Biomaxxer static site — full nginx config (replaces /etc/nginx/nginx.conf).
#
# TLS, HTTP/2/3 and the public domain are terminated by the client's own
# proxy/host layer; this container serves plain HTTP on :80 behind it.

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Correct MIME types for modern assets. A wrong font MIME causes a silent
    # fallback to system fonts in some browsers. (Duplicate-extension warnings
    # at startup are harmless if this nginx build already maps these.)
    types {
        image/avif avif;
        font/woff2 woff2;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ---- compression: brotli first, gzip fallback --------------------------
    # (text/html is always compressed by both modules; listing it again
    #  triggers a duplicate-MIME warning, so it is omitted.)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml application/xml text/xml text/plain
               application/manifest+json;

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 512;
    brotli_types text/css application/javascript text/javascript application/json
                 image/svg+xml application/xml text/xml text/plain
                 application/manifest+json;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        error_page 404 /404.html;

        # Hashed build assets: safe to cache forever.
        # (add_header replaces inherited headers, so the security set is
        #  repeated here deliberately.)
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri =404;
        }

        # Stable-name media: cached a week, so replacing a placeholder image
        # or the hero video under the same filename propagates quickly.
        location ~ ^/(img|fonts|video)/ {
            expires 7d;
            try_files $uri =404;
        }

        # HTML (and robots/sitemap): always revalidate.
        location / {
            expires epoch;
            try_files $uri $uri/index.html =404;
        }
    }
}
